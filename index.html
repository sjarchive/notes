/* ===================== Theme Variables =====================
   Change the site's whole look from here. Everything below (splash,

--grad-4:#e18aab;

/* Glass panels (container, cards, modals) */
--glass-bg:rgba(255,255,255,.15);
--glass-bg-strong:rgba(255,255,255,.25);
--glass-border:rgba(255,255,255,.25);

/* Text */
--text-color:#ffffff;

/* Action buttons */

/* Card left-border accent colors (cycled per card) */

--card-accent-3:#6bcb77;
--card-accent-4:#4d96ff;
--card-accent-5:#ff922b;
--card-accent-6:#cc5de8;

/* Floating decorative blobs */
--blob-1:#8e6fd8;
--blob-2:#e18aab;
--blob-3:#5c6bc0;

/* Dark mode */

--dark-grad-1:#181c33;
--dark-grad-2:#241c38;
--dark-grad-3:#331f38;
--dark-grad-4:#3a2130;
--dark-panel:rgba(28,22,42,.78);
--dark-panel-strong:rgba(24,19,36,.94);

--dark-card-hover:rgba(255,255,255,.08);

/* Splash Screen */

    -45deg in oklch,
    var(--grad-1),
    var(--grad-2),
    var(--grad-3),
    var(--grad-4)

background-size:400% 400%;

gradientBG 15s ease infinite;

opacity .6s ease,

}

/* Login / Sign Up Modal */

.modal-overlay{

-webkit-backdrop-filter:blur(4px);

display:flex;

align-items:center;

padding:20px;

z-index:200;

}

/* Pop-in wrapper: the entry transform animation lives HERE, not on
   .auth-modal, because an element that carries backdrop-filter must never
   be animated with transform/opacity itself — Chromium then renders the
   blur region as a flat, un-rounded translucent rectangle with sharp
   boundaries around the dialog for the duration of the animation (and it
   can stick after it). A transform on this plain wrapper doesn't touch
   the child's blur clipping, so the rounded glass renders correctly from
   the first frame. */

.auth-modal-pop{

width:100%;

max-width:360px;

max-height:100%;

display:flex;

animation:modalPopIn .3s ease;

}

.auth-modal{

position:relative;

width:100%;

max-height:100%;

overflow-y:auto;

background:rgba(40,30,70,.85);

border:1px solid rgba(255,255,255,.25);

border-radius:20px;

padding:44px 24px 24px;

backdrop-filter:blur(16px);

-webkit-backdrop-filter:blur(16px);

box-shadow:0 20px 50px rgba(0,0,0,.4);

}

/* .auth-modal only fades in its direct children (never its own opacity),
   because animating opacity on an element that also has backdrop-filter is
   a known cross-browser rendering issue: the blur doesn't render correctly
   until the animation finishes, causing a flat, unblurred rectangle to
   flash in first. None of the children use backdrop-filter, so they're
   free to animate opacity safely. The pop-in motion itself is on the
   .auth-modal-pop wrapper above. */

@keyframes modalPopIn{

from{
transform:translateY(10px);
}

to{
transform:translateY(0);
}

}

.auth-modal > *{

animation:modalContentFadeIn .3s ease;

}

@keyframes modalContentFadeIn{

from{
opacity:0;
}

to{
opacity:1;
}

}

/* Subtle grain over the gradient. Large smooth color fields can show visible

/* Buttons */

/* .actions is now the animated grid track: its height comes from
   grid-template-rows (0fr -> 1fr), which the browser can animate without
   recomputing layout each frame, unlike max-height. .actions-inner is the
   actual flex box holding the buttons; it clips to whatever the track's
   current height is via overflow:hidden + min-height:0. */

.actions{

display:grid;

grid-template-rows:0fr;

opacity:0;

transform:translateY(-8px) translateZ(0);

pointer-events:none;

transition:
grid-template-rows .3s ease,
opacity .25s ease,
transform .25s ease,
margin-top .25s ease;

will-change:grid-template-rows, opacity, transform;

}

.note-card.active .actions{

grid-template-rows:1fr;

opacity:1;

transform:translateY(0);

pointer-events:auto;

margin-top:15px;

}

.actions-inner{

display:flex;

flex-wrap:wrap;

gap:10px;

overflow:hidden;

min-height:0;

padding:4px;

}

.actions-inner.overflow-visible{

overflow:visible;

}

/* When collapsed, .actions-inner's own padding still renders even though
   the 0fr grid row clips its content to nothing, leaving a few pixels of
   dead space that pushes the h2 title above true center. Dropping the
   padding while collapsed removes that gap without affecting the expanded
   (.active) state, where the padding is still needed around the buttons. */
.note-card:not(.active) .actions-inner{

padding:0;

}

.dark .container{

background:var(--dark-panel);

border:1px solid rgba(255,255,255,.08);

}



.dark .note-card{

background:var(--dark-card);

}



.dark .note-card:hover,
.dark .note-card.raised{

background:var(--dark-card-hover);

}



.dark #themeToggle{

background:#333;

color:white;

}



/* Mobile */



@media(max-width:600px){



    body{

        padding:15px;

    }



    .container{

        padding:18px;

    }



h1{

    font-size:1.6rem;

}



.note-card h2{

    font-size:18px;

}

/* Touch devices can retain :hover after a tap, which made cards shift while
   their action area was expanding. Keep the tap interaction in one stable spot.
   .raised is excluded so the click-driven raise still works on mobile. */
.note-card:hover:not(.raised){

    transform:none;

    box-shadow:none;

}

.notes-grid{

    gap:20px;

}



.actions-inner{

    flex-direction:column;
    flex-wrap:nowrap;

}

.actions a,

.actions button{

    width:100%;

    text-align:center;

}



}

    </style>
    
    <meta name="theme-color" content="#4568dc">
</head>
<body>

<div id="splash">

    <div class="splash-content">

        <div class="splash-icon">📚</div>

        <h1>B.Ed. I Year Notes</h1>

        <p>Loading...</p>

    </div>

</div>

<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>

<div class="container">

    <div class="top-bar">
        <div id="profileContainer" class="profile-container hidden">
            <button id="profileBtn" class="profile-btn" onclick="toggleProfileMenu(event)" aria-label="Account menu">👤</button>
            <div id="profileMenu" class="profile-menu hidden-form">
                <p id="profileUsername" class="profile-username"></p>
                <button id="manageNotesBtn" class="profile-logout hidden-form" onclick="openManageModal()">🗂️ Manage Notes</button>
                <button class="profile-logout" onclick="handleLogout()">🚪 Log out</button>
            </div>
        </div>
        <button id="themeToggle">🌙 Dark Mode</button>
    </div>

    <!-- Home Screen -->
    <div id="homeScreen">
        <div class="home-icon">📚</div>
        <h1>B.Ed. I Year Notes</h1>
        <p class="home-subtitle">First year notes, all in one place</p>
        <button id="enterBtn" onclick="handleEnterClick()">Enter →</button>
    </div>

    <!-- Notes Section (hidden until Enter is clicked) -->
    <div id="notesSection" class="hidden">

    <h1>📚 B.Ed. I Year Notes</h1>

    <p id="subjectCount"></p>

    <div class="notes-grid" id="notesGrid"></div><!-- populated dynamically by loadNotes() in script.js -->

    </div><!-- end notesSection -->

</div><!-- end container -->

    <!-- Login / Sign Up + Manage Notes modals: direct children of <body>. An
    ancestor with backdrop-filter (.container) becomes the containing block for
    position:fixed descendants, which made the overlay dim/blur only cover the
    container box with visible boundaries instead of the whole page. -->

    <!-- Login / Sign Up Modal -->
    <div id="authModalOverlay" class="modal-overlay hidden-form" onclick="closeAuthModalOnOverlay(event)">
        <div class="auth-modal-pop">
        <div class="auth-modal" onclick="event.stopPropagation()">

            <button type="button" class="modal-close" onclick="closeAuthModal()" aria-label="Close">✕</button>

            <div class="auth-tabs">
                <button type="button" id="loginTabBtn" class="auth-tab active" onclick="switchAuthTab('login')">Log In</button>
                <button type="button" id="signupTabBtn" class="auth-tab" onclick="switchAuthTab('signup')">Sign Up</button>
            </div>

            <form id="loginForm" class="auth-form" onsubmit="return handleLogin(event)">
                <input type="text" id="loginUsername" placeholder="Username" autocomplete="username" maxlength="10" required>
                <div class="password-wrap">
                    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" maxlength="20" required>
                    <button type="button" class="toggle-password" aria-label="Show password" onclick="togglePassword('loginPassword', this)"></button>
                </div>
                <button type="submit" class="auth-submit">Log In</button>
            </form>

            <form id="signupForm" class="auth-form hidden-form" onsubmit="return handleSignup(event)">
                <input type="text" id="signupUsername" placeholder="Choose a username" autocomplete="username" maxlength="10" required>
                <div class="password-wrap">
                    <input type="password" id="signupPassword" placeholder="Choose a password" autocomplete="new-password" maxlength="20" required>
                    <button type="button" class="toggle-password" aria-label="Show password" onclick="togglePassword('signupPassword', this)"></button>
                </div>
                <p class="auth-hint">Username: 5–10 characters (letters, numbers, underscores).<br>Password: 8–20 characters with uppercase, lowercase, number & special character.</p>
                <button type="submit" class="auth-submit">Sign Up</button>
            </form>

            <p id="authError" class="auth-error"></p>

        </div>
        </div>
    </div>

    <!-- Manage Notes Modal (admin only) -->
    <div id="manageModalOverlay" class="modal-overlay hidden-form" onclick="closeManageModalOnOverlay(event)">
        <div class="auth-modal-pop">
        <div class="auth-modal" onclick="event.stopPropagation()">

            <button type="button" class="modal-close" onclick="closeManageModal()" aria-label="Close">✕</button>

            <h2 class="manage-title">🗂️ Manage Notes</h2>

            <form id="addNoteForm" class="auth-form" onsubmit="return handleAddNote(event)">
                <input type="text" id="newNoteTitle" placeholder="Subject title" required>
                <input type="file" id="newNoteFile" accept="application/pdf" required>
                <button type="submit" class="auth-submit">⬆️ Upload</button>
            </form>

            <p id="manageStatus" class="auth-error"></p>

            <div id="manageNotesList" class="manage-notes-list"></div>

        </div>
        </div>
    </div>



<button id="topBtn">↑</button>

<div id="toast"></div>

<!-- Supabase (Authentication + PDF Storage) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script src="script.js"></script>

</html>
