name: Supabase Keep-Alive

# Pings the Supabase project daily so it never sits idle for the 7 days
# that would trigger the free tier's automatic pause.

on:
  schedule:
    - cron: "0 6 * * *"   # every day at 06:00 UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -s -o /dev/null -w "Supabase responded with HTTP %{http_code}\n" \
            "https://eztspowxxwxhavhpkthm.supabase.co/rest/v1/" \
